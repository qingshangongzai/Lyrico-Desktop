name: 构建桌面应用

# 仅手动触发：在 Actions 页面选择本工作流并运行
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      # FFmpeg 子模块的 configure / build.sh 在 Windows 检出时必须保持 LF
      - name: 保留 LF 换行符
        run: git config --global core.autocrlf input

      - name: 检出仓库与子模块
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # FFmpeg 在 Windows 上依赖 MSYS2 的 bash、make、diffutils、pkgconf 与 NASM
      - name: 安装 MSYS2 构建依赖
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          release: false
          update: true
          install: >-
            make
            diffutils
            pkgconf
            nasm
            sed

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable

      # 同时缓存 Cargo 产物与 FFmpeg / TagLib 的原生编译结果
      - name: 缓存 Rust 与原生构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 应用
        env:
          LYRICO_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: npm run tauri build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: Lyrico-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*
          if-no-files-found: error
